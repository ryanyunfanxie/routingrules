name: Build and deploy routing rules

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          # A PAGES_TOKEN lets configure-pages enable Pages when the repository
          # has never been configured. Without it, the normal GitHub Actions
          # token can still read an already-enabled Pages site.
          enablement: true
          token: ${{ secrets.PAGES_TOKEN || github.token }}
      - name: Build public rule files
        run: python scripts/build_rules.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
