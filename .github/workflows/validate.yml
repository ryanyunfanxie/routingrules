name: Validate routing rules

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build and validate outputs
        run: |
          python scripts/build_rules.py
          python -m json.tool public/v2rayn/custom_routing_rules.json > /dev/null
